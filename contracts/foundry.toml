# Forge config for the Readable registry.
#
# lib/ is vendored and not committed. Restore it with:
#   npm pack forge-std                     -> lib/forge-std/src
#   npm pack @openzeppelin/contracts@5.6.1 -> lib/openzeppelin-contracts (the package root itself)
# Strip everything that is not .sol.
#
#   forge build
#   forge test
#   node deploy/build-artifacts.mjs        -> deploy/artifacts + the app ABI

[profile.default]
src = "src"
test = "test"
out = "out"
cache_path = "cache"
libs = []
auto_detect_remappings = false
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/",
  "forge-std/=lib/forge-std/src/",
]
solc = "0.8.36"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
